name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust components and WASI Preview 2 target
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-wasip2
      - name: Verify dependency graph is pinned
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Host tests
        run: cargo test --locked
      - name: Host clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: WASI clippy
        run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - name: WASI release component
        run: cargo build --locked --target wasm32-wasip2 --release
      - name: Component fingerprint
        run: |
          test -s target/wasm32-wasip2/release/solana_program_integrity.wasm
          sha256sum target/wasm32-wasip2/release/solana_program_integrity.wasm
